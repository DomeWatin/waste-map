# ตรวจ Google My Maps ทุก 3 ชั่วโมง แล้วอัปเดต Neon เฉพาะเมื่อแผนที่เปลี่ยน
# ใช้แทน Render Cron Job (ไม่ต้องจ่ายค่า cron และไม่ต้องปลุกเว็บ Render ที่หลับอยู่)
# ตั้งค่า: GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   ชื่อ DATABASE_URL  ค่า = connection string ของ Neon
name: sync-waste-map

on:
  schedule:
    - cron: "7 */3 * * *"   # ทุก 3 ชม. (เวลา UTC) เลี่ยงนาทีที่ 0 ซึ่งคิวแน่น
  workflow_dispatch:         # กดรันเองได้ที่แท็บ Actions

concurrency:
  group: sync-waste-map
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Sync from Google My Maps to Neon
        run: node sync.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MYMAPS_MID: 1WyMxRL6t_FJZXkIRAyQ_UGg-xPfYz6w
